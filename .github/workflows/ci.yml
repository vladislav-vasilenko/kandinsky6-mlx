name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/unit/test_kaggle_record_dit.py checks the commit pinned by the Kaggle kernel.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev --group reference --extra text
      - run: uv run ruff check
      - run: uv run pytest -q -m "not real_weights and not slow"
